name: Finance AI Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: finance_ai_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_ai_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENVIRONMENT: test
      APP_DEBUG: "false"
      APP_CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci_password
      DB_NAME: finance_ai_db_test
      SECURITY_ALLOW_PUBLIC_REGISTRATION: "true"
      BROKER_PROVIDER: in_memory

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Generate ephemeral JWT secret
        run: echo "SECURITY_JWT_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app tests alembic
      - name: Migration upgrade
        run: alembic upgrade head
      - name: Unit and integration tests
        run: python -m pytest tests/unit tests/integration -v --cov=app --cov-report=term-missing
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check app tests alembic
      - name: MyPy
        run: mypy app
      - name: Bandit
        run: bandit -r app -x tests
      - name: pip-audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "::warning::frontend/package-lock.json is missing; dependency versions are not locked. Run 'npm run lockfile' and commit it."; npm install; fi
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit/component tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: finance_ai_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_ai_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      APP_DEBUG: "false"
      APP_CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci_password
      DB_NAME: finance_ai_db_test
      SECURITY_ALLOW_PUBLIC_REGISTRATION: "true"
      BROKER_PROVIDER: in_memory
      E2E_EMAIL: ci-finance@example.com
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "::warning::frontend/package-lock.json is missing; dependency versions are not locked. Run 'npm run lockfile' and commit it."; npm install; fi
      - name: Generate ephemeral E2E secrets
        run: |
          echo "SECURITY_JWT_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(python -c "import secrets, string; print('E2E-' + ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(24)) + '!')")" >> "$GITHUB_ENV"
      - name: Prepare database
        run: alembic upgrade head
      - name: Start API
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
      - name: Wait for API
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/api/v1/health/ready && exit 0; sleep 2; done
          cat /tmp/api.log
          exit 1
      - name: Create E2E finance director
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-finance@example.com\",\"password\":\"$E2E_PASSWORD\",\"full_name\":\"CI Finance Director\",\"role\":\"finance_director\"}"
      - name: Start frontend
        working-directory: frontend
        env:
          # The dev server has no API proxy, so point the browser straight at the API (CORS allows it).
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run dev > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/frontend.log
          exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Accessibility E2E
        working-directory: frontend
        run: npm run test:a11y

  docker:
    # Proves both images still build. Compose startup against a real database is a manual gate
    # recorded in docs/GO_LIVE_CHECKLIST.md until it is automated here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t finance-ai-api:ci .
      - name: Build frontend image
        run: docker build -t finance-ai-frontend:ci ./frontend
